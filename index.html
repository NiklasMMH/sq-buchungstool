<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesqueens Termine · Prototyp</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F9F7F5;--rose:#C0597B;--rose2:#D27997;--ink:#2A2522;--muted:#7C706A;--line:#E8E1DC;--card:#fff;--soft:#F3E6EB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "DM Sans",system-ui,sans-serif}
  .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
  .top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff}
  .logo{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:24px;color:var(--rose)}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px}
  .tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font:inherit;color:var(--muted);cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .badge{margin-left:auto;font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:999px}
  .wrap{max-width:1040px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  h1,h2,h3{margin:0}
  .muted{color:var(--muted)}
  button.pri{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.pri:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer;color:var(--ink)}
  /* Lead: funnel */
  .funnel{max-width:560px;margin:10px auto;padding:30px}
  .bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 22px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose2));transition:width .3s}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;cursor:pointer}
  .opt:hover{border-color:var(--rose2);background:#fffafb}
  /* Lead: booking (Calendly-artig) */
  .book{display:grid;grid-template-columns:250px 1fr 210px;min-height:470px}
  .book>div{padding:24px}
  .book .info{border-right:1px solid var(--line)}
  .info .meta{margin-top:14px;display:grid;gap:8px;color:var(--muted)}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .grid .wd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .day{aspect-ratio:1;border-radius:50%;border:0;background:transparent;font:inherit;color:#c5bcb6;cursor:default}
  .day.av{background:var(--soft);color:var(--rose);font-weight:600;cursor:pointer}
  .day.sel{background:var(--rose);color:#fff}
  .slots{border-left:1px solid var(--line);overflow:auto;max-height:520px}
  .slot{display:flex;gap:6px;margin:0 0 8px}
  .slot button{flex:1;padding:11px 0;border:1px solid var(--rose2);color:var(--rose);background:#fff;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
  .slot button.pick{background:var(--ink);border-color:var(--ink);color:#fff}
  .slot .go{background:var(--rose);border-color:var(--rose);color:#fff}
  .form{display:grid;gap:10px;max-width:380px}
  .form input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
  .done{padding:30px;display:grid;gap:12px}
  .check{display:flex;gap:10px;align-items:flex-start}
  .check b{color:var(--rose)}
  /* Team */
  .layout{display:grid;grid-template-columns:200px 1fr;gap:18px}
  .side{display:grid;gap:4px;align-content:start}
  .side button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;color:var(--muted)}
  .side button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .et{display:grid;grid-template-columns:6px 1fr auto;gap:0;overflow:hidden;margin-bottom:12px}
  .et .stripe{background:var(--rose)}
  .et .body{padding:16px 18px}
  .et .act{padding:16px 18px;display:flex;align-items:center}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--rose);margin:2px 4px 2px 0}
  .edit{padding:22px;display:grid;gap:18px}
  .row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center}
  .row input[type=number]{width:80px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .member{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
  .member.off{opacity:.5}
  .member .name{flex:1}
  .sw{width:38px;height:22px;border-radius:99px;background:#ddd;position:relative;cursor:pointer;border:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:var(--rose)}.sw.on::after{left:19px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  th{color:var(--muted);font-weight:500}
  .tl{position:relative;height:30px;background:#faf7f5;border-radius:6px;margin:4px 0}
  .tl span{position:absolute;top:3px;bottom:3px;border-radius:4px;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .tl .win{background:#eadbe1;top:0;bottom:0;border-radius:6px}
  .tl .bk{background:var(--rose)}
  .tl .buf{background:var(--rose2);opacity:.45}
  .hint{font-size:12px;color:var(--muted)}
  @media (max-width:820px){.book{grid-template-columns:1fr}.book .info,.slots{border:0}.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">salesqueens</div>
  <div class="tabs"><button id="tLead" class="on">Buchungsseite (Lead)</button><button id="tTeam">Verwaltung (Team)</button></div>
  <div class="badge">Prototyp · erfundene Zeiten · nichts wird gebucht</div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ===== Daten (Beispiel) ===== */
const STEP = 30;
const hm = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const fm = x => String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const WT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const NOW = new Date(2026,9,4,18,0); // So 04.10.2026 18:00 (Demo-"jetzt")

const REPS = {
  regina:   {name:'Regina',   wins:{1:[['09:00','12:00']],2:[['09:00','12:00'],['14:00','17:00']],3:[['09:00','12:00']],4:[['09:00','12:00']],5:[['09:00','12:00']]}},
  anthonia: {name:'Anthonia', wins:{1:[['11:00','16:00']],2:[['11:00','16:00']],3:[['10:00','13:00']],4:[['11:00','16:00']],5:[['11:00','14:00']]}},
  sophie:   {name:'Sophie',   wins:{1:[['14:00','20:00']],2:[['14:00','20:00']],3:[['14:00','20:00']],4:[['15:00','18:00']],5:[]}},
  fabienne: {name:'Fabienne', wins:{1:[['10:00','13:00']],2:[],3:[['16:00','19:00']],4:[['10:00','13:00']],5:[['09:00','12:00']]}},
  justine:  {name:'Justine',  wins:{1:[['17:00','20:00']],2:[['17:00','20:00']],3:[],4:[['17:00','20:00']],5:[]}},
  juliane:  {name:'Juliane',  wins:{1:[['09:00','13:00'],['14:00','17:00']],2:[['09:00','13:00']],3:[['09:00','13:00'],['14:00','17:00']],4:[['09:00','13:00']],5:[['09:00','12:00']]}},
};
const EVENTS = [
  {id:'closing_webinar', name:'Closing nach Webinar', alt:'heute: Strategy Call', dur:60, buf:30, chain:true, days:14, notice:4, zoom:true,
   pool:[{rep:'regina',on:true,prio:1},{rep:'anthonia',on:true,prio:1},{rep:'sophie',on:true,prio:1},{rep:'fabienne',on:false,prio:2},{rep:'justine',on:false,prio:2}]},
  {id:'closing_setting', name:'Closing nach Setting', alt:'heute: Strategy Session', dur:60, buf:30, chain:true, days:14, notice:4, zoom:true,
   pool:[{rep:'regina',on:true,prio:1},{rep:'anthonia',on:true,prio:1},{rep:'sophie',on:true,prio:1},{rep:'justine',on:true,prio:1},{rep:'fabienne',on:false,prio:2}]},
  {id:'setting', name:'Setting', alt:'heute: Discovery Call / Onboarding', dur:30, buf:0, chain:true, days:7, notice:2, zoom:false,
   pool:[{rep:'juliane',on:true,prio:1}]},
];
const QUESTIONS = [
  {key:'age', q:'Wie alt bist du?', o:[['18 – 24',0],['25 – 34',0],['35 – 44',0],['45+',0]]},
  {key:'wohnort', q:'Wo lebst du gerade?', o:[['Deutschland',3],['Österreich',3],['Schweiz',3,'setter'],['Sonstiges',1]]},
  {key:'situation', q:'Was beschreibt deine aktuelle Situation am besten?', o:[['Angestellt in Vollzeit',3],['Angestellt in Teilzeit',2],['Selbstständig',3],['Studentin / Schülerin',1,'setter'],['In Elternzeit',2],['Aktuell ohne Job',0,'setter']]},
  {key:'invest', q:'Bist du bereit, in dich und deine Zukunft zu investieren?', o:[['Ja',2],['Weiß ich noch nicht',1,'setter'],['Nein',0,'dq']]},
];
const CLOSER_MIN = 6;

/* ===== Kettenregel ===== */
function starts(g, block, chain){
  const out = [], k = Math.floor((g.b-g.a)/block);
  for (let s = Math.ceil(g.a/STEP)*STEP; s+block <= g.b; s += STEP){
    const left = s-g.a, right = g.b-s-block;
    let ok = Math.floor(left/block)+1+Math.floor(right/block) === k;
    if (ok && chain){
      const rest = [[left,g.L],[right,g.R]].filter(p => p[0] % block);
      ok = rest.length <= 1 && rest.every(p => p[1] === 'F');
    }
    if (ok) out.push(s);
  }
  return out;
}
const dkey = d => d.toISOString().slice(0,10);
let BOOKINGS = [];   // {ev, rep, day, s, lead}
function gaps(rep, day){
  const wd = (day.getDay()+6)%7+1;
  let gs = (REPS[rep].wins[wd]||[]).map(([a,b]) => ({a:hm(a), b:hm(b), L:'F', R:'F'}));
  for (const bk of BOOKINGS.filter(x => x.rep===rep && x.day===dkey(day)).sort((x,y)=>x.s-y.s)){
    const blk = bk.block; const n = [];
    for (const g of gs){
      if (bk.s < g.b && bk.s+blk > g.a){
        if (bk.s > g.a) n.push({a:g.a, b:bk.s, L:g.L, R:'T'});
        if (bk.s+blk < g.b) n.push({a:bk.s+blk, b:g.b, L:'T', R:g.R});
      } else n.push(g);
    }
    gs = n;
  }
  return gs;
}
function mask(ev, day){
  const block = ev.dur+ev.buf, m = new Map();
  const earliest = new Date(NOW.getTime()+ev.notice*3600e3);
  for (const p of ev.pool.filter(p=>p.on)){
    for (const g of gaps(p.rep, day)) for (const s of starts(g, block, ev.chain)){
      const t = new Date(day); t.setHours(0,s,0,0);
      if (t < earliest) continue;
      if (!m.has(s)) m.set(s, []);
      m.get(s).push(p);
    }
  }
  return new Map([...m.entries()].sort((a,b)=>a[0]-b[0]));
}
function assign(ev, day, s){
  const c = mask(ev, day).get(s) || [];
  const cnt = r => BOOKINGS.filter(b => b.rep===r).length;
  return c.slice().sort((x,y) => x.prio-y.prio || cnt(x.rep)-cnt(y.rep))[0];
}
function bookableDays(ev){
  const out = [];
  for (let i=1;i<=ev.days;i++){ const d = new Date(NOW); d.setDate(d.getDate()+i); d.setHours(0,0,0,0); out.push(d); }
  return out.filter(d => mask(ev,d).size);
}

/* ===== UI ===== */
const app = document.getElementById('app');
let view = 'lead', teamTab = 'events', editEv = null;
let L = {step:0, ans:{}, route:null, day:null, pick:null, booked:null};
document.getElementById('tLead').onclick = () => { view='lead'; tabs(); render(); };
document.getElementById('tTeam').onclick = () => { view='team'; tabs(); render(); };
function tabs(){ tLead.classList.toggle('on',view==='lead'); tTeam.classList.toggle('on',view==='team'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){ view==='lead' ? renderLead() : renderTeam(); }

function routeOf(ans){
  let score = 0, setter = false;
  for (const q of QUESTIONS){ const o = q.o[ans[q.key]]; if (!o) continue; score += o[1]; if (o[2]==='dq') return {r:'dq',score}; if (o[2]==='setter') setter = true; }
  return {r: setter ? 'setting' : score >= CLOSER_MIN ? 'closing_webinar' : 'setting', score};
}
function renderLead(){
  if (L.step < QUESTIONS.length){
    const q = QUESTIONS[L.step];
    app.innerHTML = `<div class="card funnel">
      <div class="muted">Frage ${L.step+1} von ${QUESTIONS.length}</div>
      <div class="bar"><i style="width:${L.step/QUESTIONS.length*100}%"></i></div>
      <h2 class="serif" style="font-size:28px;margin-bottom:14px">${esc(q.q)}</h2>
      ${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join('')}
      ${L.step?'<button class="ghost" id="back" style="margin-top:10px">Zurück</button>':''}</div>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => { L.ans[q.key] = +b.dataset.i; L.step++; if (L.step===QUESTIONS.length){ L.route = routeOf(L.ans); } render(); });
    const bk = document.getElementById('back'); if (bk) bk.onclick = () => { L.step--; render(); };
    return;
  }
  if (L.route.r === 'dq'){
    app.innerHTML = `<div class="card funnel"><h2 class="serif" style="font-size:28px">Aktuell können wir dich leider <i style="color:var(--rose)">nicht begleiten</i></h2>
      <p class="muted">Gleicher Text wie heute auf /onboarding.</p><button class="ghost" id="restart">Antworten ändern</button></div>`;
    restart.onclick = () => { L = {step:0, ans:{}, route:null}; render(); };
    return;
  }
  const ev = EVENTS.find(e => e.id === L.route.r);
  if (L.booked){
    const b = L.booked, rep = REPS[b.rep].name;
    app.innerHTML = `<div class="card done">
      <h2 class="serif" style="font-size:30px">Dein Termin steht, <i style="color:var(--rose)">${esc(b.lead.first)}</i></h2>
      <div class="muted">${WT[(b.d.getDay()+6)%7]}, ${b.d.toLocaleDateString('de-DE')} · ${fm(b.s)} – ${fm(b.s+ev.dur)} Uhr · mit ${rep}</div>
      <div class="hint" style="margin-top:6px">Was das echte Tool jetzt automatisch macht (hier nur simuliert):</div>
      <div class="check"><b>✓</b> Google-Kalender von ${rep}: Termin ${fm(b.s)} – ${fm(b.s+ev.dur)} mit dem Lead als Gast, Einladung geht an ${esc(b.lead.mail)}${ev.buf?`, dazu Puffer ${fm(b.s+ev.dur)} – ${fm(b.s+ev.dur+ev.buf)}`:''}</div>
      <div class="check"><b>✓</b> ${ev.zoom?`Eigenes Zoom-Meeting im Account von ${rep}, Link steht in Einladung und Bestätigung`:'Telefon: die Setterin ruft an, Nummer steht im Termin'}</div>
      <div class="check"><b>✓</b> Close: Lead angelegt oder gefunden, Antworten in den Feldern „Onboarding Alter / Wohnort / Situation / Investitionsbereitschaft / Score / Route“, Deal und Termin wie heute</div>
      <div class="check"><b>✓</b> Bestätigungsmail mit Links „Verschieben“ und „Absagen“, Erinnerungen vor dem Termin</div>
      <div><button class="ghost" id="again">Noch ein Lead bucht (gleicher Kalender)</button></div></div>`;
    again.onclick = () => { L = {step:0, ans:{}, route:null}; render(); };
    return;
  }
  const days = bookableDays(ev);
  if (!L.day && days.length) L.day = dkey(days[0]);
  const sel = days.find(d => dkey(d) === L.day);
  const m = sel ? mask(ev, sel) : new Map();
  const first = new Date(NOW); first.setDate(1);
  const month = [], startPad = (first.getDay()+6)%7;
  for (let i=0;i<startPad;i++) month.push(null);
  const dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  for (let i=1;i<=dim;i++) month.push(new Date(first.getFullYear(), first.getMonth(), i));
  const avail = new Set(days.map(dkey));
  app.innerHTML = `<div class="card book">
    <div class="info"><div class="logo" style="font-size:20px">salesqueens</div>
      <h2 class="serif" style="font-size:26px;margin-top:10px">${ev.id==='setting'?'Dein Onboarding-Call':'Dein Strategie-Gespräch'}</h2>
      <div class="meta"><div>◷ ${ev.dur} Min</div><div>${ev.zoom?'▣ Zoom, Link kommt per Mail':'✆ Wir rufen dich an'}</div><div>Buchbar bis ${ev.days} Tage im Voraus</div></div>
      <div class="hint" style="margin-top:22px">Route aus deinen Antworten: <b>${ev.name}</b> (Score ${L.route.score})</div>
      <button class="ghost" id="chg" style="margin-top:10px">Antworten ändern</button></div>
    <div><div class="cal-head"><h3 class="serif" style="font-size:22px">Wähle Datum und Uhrzeit</h3><span class="muted">${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</span></div>
      <div class="grid">${WT.map(w=>`<div class="wd">${w}</div>`).join('')}
      ${month.map(d => d ? `<button class="day ${avail.has(dkey(d))?'av':''} ${dkey(d)===L.day?'sel':''}" data-d="${dkey(d)}">${d.getDate()}</button>` : '<div></div>').join('')}</div>
      <div class="hint" style="margin-top:14px">Zeitzone: Europa/Berlin</div></div>
    <div class="slots"><div class="muted" style="margin-bottom:10px">${sel?`${WT[(sel.getDay()+6)%7]}, ${sel.toLocaleDateString('de-DE')}`:'Keine Termine frei'}</div>
      ${[...m.keys()].map(s => `<div class="slot">${L.pick===s?`<button class="pick">${fm(s)}</button><button class="go" data-go="${s}">Weiter</button>`:`<button data-s="${s}">${fm(s)}</button>`}</div>`).join('')}
    </div></div>
    ${L.pick!=null && L.form ? '' : ''}`;
  chg.onclick = () => { L = {step:0, ans:{}, route:null}; render(); };
  app.querySelectorAll('.day.av').forEach(b => b.onclick = () => { L.day = b.dataset.d; L.pick = null; render(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { L.pick = +b.dataset.s; render(); });
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => form(ev, sel, +b.dataset.go));
}
function form(ev, day, s){
  const box = app.querySelector('.slots');
  box.innerHTML = `<div class="form"><div class="muted">${fm(s)} Uhr</div>
    <input id="fn" placeholder="Vorname" value="Test"><input id="fm" placeholder="E-Mail" value="test@beispiel.de"><input id="ft" placeholder="Telefonnummer" value="+49 170 0000000">
    <button class="pri" id="ok">Termin buchen</button><button class="ghost" id="cx">Zurück</button></div>`;
  cx.onclick = () => render();
  ok.onclick = () => {
    const p = assign(ev, day, s);
    if (!p){ alert('Gerade vergeben, bitte andere Zeit wählen'); L.pick=null; return render(); }
    const b = {ev:ev.id, rep:p.rep, day:dkey(day), d:day, s, block:ev.dur+ev.buf, lead:{first:fn.value, mail:fm_.value}};
    BOOKINGS.push(b); L.booked = b; L.pick = null; render();
  };
  var fm_ = document.getElementById('fm');
}

/* ===== Team / Verwaltung ===== */
function renderTeam(){
  const side = `<div class="side">
    <button data-t="events" class="${teamTab==='events'?'on':''}">Ereignistypen</button>
    <button data-t="booked" class="${teamTab==='booked'?'on':''}">Gebuchte Termine</button>
    <button data-t="avail" class="${teamTab==='avail'?'on':''}">Verfügbarkeit</button>
    <button data-t="funnel" class="${teamTab==='funnel'?'on':''}">Funnel-Fragen</button></div>`;
  let main = '';
  if (teamTab==='events' && !editEv){
    main = `<h2 class="serif" style="font-size:30px;margin-bottom:14px">Ereignistypen</h2>` + EVENTS.map(e => {
      const on = e.pool.filter(p=>p.on);
      return `<div class="card et"><div class="stripe" style="background:${e.id==='setting'?'#7C706A':'var(--rose)'}"></div>
        <div class="body"><h3 style="font-size:16px">${esc(e.name)} <span class="hint">(${esc(e.alt)})</span></h3>
          <div class="muted" style="margin:4px 0 8px">${e.dur} Min${e.buf?` + ${e.buf} Min Puffer`:''} · Round Robin · ${on.length} ${on.length===1?'Person':'Personen'} · bis ${e.days} Tage im Voraus · ${e.chain?'lückenlose Kette':'jede halbe Stunde'}</div>
          ${on.map(p=>`<span class="pill">${REPS[p.rep].name}</span>`).join('')}</div>
        <div class="act"><button class="ghost" data-e="${e.id}">Bearbeiten</button></div></div>`;}).join('');
  } else if (teamTab==='events'){
    const e = EVENTS.find(x=>x.id===editEv);
    main = `<button class="ghost" id="bk">← Ereignistypen</button>
      <div class="card edit" style="margin-top:12px"><h2 class="serif" style="font-size:28px">${esc(e.name)}</h2>
      <div class="row"><div>Dauer</div><div><input type="number" id="dur" value="${e.dur}" step="15"> Min</div></div>
      <div class="row"><div>Puffer danach</div><div><input type="number" id="buf" value="${e.buf}" step="15"> Min</div></div>
      <div class="row"><div>Buchbar im Voraus</div><div><input type="number" id="days" value="${e.days}" min="1" max="60"> Tage</div></div>
      <div class="row"><div>Mindestvorlauf</div><div><input type="number" id="notice" value="${e.notice}" min="0"> Stunden</div></div>
      <div class="row"><div>Startzeiten</div><div><button class="sw ${e.chain?'on':''}" id="chain"></button> <span class="muted">Lückenlose Kette (09:00 bis 12:00 = nur 09:00 und 10:30)</span></div></div>
      <div><div style="margin-bottom:8px;font-weight:600">Round-Robin-Pool</div>
        ${Object.keys(REPS).map(r => { const p = e.pool.find(x=>x.rep===r); return `<div class="member ${p&&p.on?'':'off'}"><span class="name">${REPS[r].name}</span>
          <span class="hint">Priorität</span><input type="number" min="1" max="3" value="${p?p.prio:2}" data-prio="${r}" style="width:54px;padding:5px;border:1px solid var(--line);border-radius:8px">
          <button class="sw ${p&&p.on?'on':''}" data-m="${r}"></button></div>`; }).join('')}
        <div class="hint">Neue Vertrieblerin: einmal unter Team anlegen (Google-Konto + Zoom), danach hier einschalten. Gilt ab der nächsten Berechnung der Maske.</div></div>
      <div class="row"><div>Link / Einbettung</div><div><code style="font-size:12px">termin.salesqueens.de/${e.id.replace('_','-')}</code></div></div></div>`;
  } else if (teamTab==='booked'){
    main = `<h2 class="serif" style="font-size:30px;margin-bottom:14px">Gebuchte Termine</h2><div class="card" style="padding:6px 10px">` + (BOOKINGS.length ? `<table><tr><th>Datum</th><th>Zeit</th><th>Ereignis</th><th>Vertrieblerin</th><th>Lead</th></tr>
      ${BOOKINGS.slice().sort((a,b)=>a.day.localeCompare(b.day)||a.s-b.s).map(b=>`<tr><td>${b.d.toLocaleDateString('de-DE')}</td><td>${fm(b.s)}</td><td>${EVENTS.find(e=>e.id===b.ev).name}</td><td>${REPS[b.rep].name}</td><td>${esc(b.lead.first)}</td></tr>`).join('')}</table>`
      : '<p class="muted" style="padding:10px">Noch keine Buchung. Auf der Buchungsseite einen Termin buchen.</p>') + `</div>
      <div class="hint" style="margin-top:10px">Verteilung: ${Object.keys(REPS).map(r=>`${REPS[r].name} ${BOOKINGS.filter(b=>b.rep===r).length}`).join(' · ')}</div>`;
  } else if (teamTab==='avail'){
    const d = bookableDays(EVENTS[0])[0] || new Date(2026,9,5);
    const scale = x => (x-hm('08:00'))/(hm('21:00')-hm('08:00'))*100;
    main = `<h2 class="serif" style="font-size:30px;margin-bottom:4px">Verfügbarkeit</h2>
      <p class="muted" style="margin-top:0">Kommt aus den Google-Kalendern (wie heute: Blocker schneiden die Zeit raus). Beispieltag ${d.toLocaleDateString('de-DE')}, rosa = frei, dunkel = gebucht, hell = Puffer.</p>
      <div class="card" style="padding:16px">${Object.keys(REPS).map(r => {
        const wd = (d.getDay()+6)%7+1;
        const wins = (REPS[r].wins[wd]||[]).map(([a,b])=>`<span class="win" style="left:${scale(hm(a))}%;width:${scale(hm(b))-scale(hm(a))}%"></span>`).join('');
        const bks = BOOKINGS.filter(b=>b.rep===r&&b.day===dkey(d)).map(b=>{const ev=EVENTS.find(e=>e.id===b.ev);return `<span class="bk" style="left:${scale(b.s)}%;width:${scale(b.s+ev.dur)-scale(b.s)}%">${fm(b.s)}</span>${ev.buf?`<span class="buf" style="left:${scale(b.s+ev.dur)}%;width:${scale(b.s+ev.dur+ev.buf)-scale(b.s+ev.dur)}%"></span>`:''}`;}).join('');
        return `<div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px"><div>${REPS[r].name}</div><div class="tl">${wins}${bks}</div></div>`;}).join('')}
      <div style="display:grid;grid-template-columns:90px 1fr"><div></div><div class="hint" style="position:relative;height:16px">${['08:00','12:00','16:00','20:00'].map(t=>`<span style="position:absolute;left:${scale(hm(t))}%;transform:translateX(-50%)">${t}</span>`).join('')}</div></div></div>`;
  } else {
    main = `<h2 class="serif" style="font-size:30px;margin-bottom:14px">Funnel-Fragen</h2><div class="card" style="padding:6px 10px"><table><tr><th>Frage</th><th>Antworten (Punkte, Sonderregel)</th></tr>
      ${QUESTIONS.map(q=>`<tr><td>${esc(q.q)}</td><td>${q.o.map(o=>`${esc(o[0])} (${o[1]}${o[2]==='setter'?', immer Setting':o[2]==='dq'?', kein Termin':''})`).join(' · ')}</td></tr>`).join('')}</table></div>
      <p class="hint">Route: ab ${CLOSER_MIN} Punkten Closing nach Webinar, sonst Setting. Antworten landen in Close in den bestehenden Feldern „Onboarding …“. Fragen, Punkte und Grenze sind hier änderbar.</p>`;
  }
  app.innerHTML = `<div class="layout">${side}<div>${main}</div></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { teamTab = b.dataset.t; editEv = null; render(); });
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { editEv = b.dataset.e; render(); });
  const bk = document.getElementById('bk'); if (bk) bk.onclick = () => { editEv = null; render(); };
  if (editEv){
    const e = EVENTS.find(x=>x.id===editEv);
    ['dur','buf','days','notice'].forEach(k => document.getElementById(k).onchange = ev => { e[k] = Math.max(0, +ev.target.value); });
    chain.onclick = () => { e.chain = !e.chain; render(); };
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const r=b.dataset.m; let p=e.pool.find(x=>x.rep===r); if(!p){p={rep:r,on:false,prio:2};e.pool.push(p);} p.on=!p.on; render(); });
    app.querySelectorAll('[data-prio]').forEach(i => i.onchange = () => { const r=i.dataset.prio; let p=e.pool.find(x=>x.rep===r); if(!p){p={rep:r,on:false,prio:2};e.pool.push(p);} p.prio=+i.value; });
  }
}
window.__sq = {mask, EVENTS, fm, starts, hm, BOOKINGS:()=>BOOKINGS, assign, bookableDays, dkey};
render();
</script>
</body>
</html>
