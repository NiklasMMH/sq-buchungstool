<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesqueens Termine</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F9F7F5;--rose:#C0597B;--rose2:#D27997;--ink:#2A2522;--muted:#7C706A;--line:#E8E1DC;--card:#fff;--soft:#F3E6EB;--ok:#3F8F63;--warn:#B7791F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "DM Sans",system-ui,sans-serif}
  .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
  .logo{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:24px;color:var(--rose)}
  .muted{color:var(--muted)} .hint{font-size:12px;color:var(--muted)}
  h1,h2,h3{margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  button{font:inherit;cursor:pointer}
  .pri{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink)}
  .ghost.sm{padding:5px 11px;font-size:13px}
  .link{background:none;border:0;color:var(--rose);padding:0;text-decoration:underline;text-underline-offset:3px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  .top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:#fff}
  .top .area{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
  .top .user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .proto{font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:999px;background:#fff}
  .wrap{max-width:1080px;margin:0 auto;padding:22px}
  .layout{display:grid;grid-template-columns:200px 1fr;gap:20px}
  .side{display:grid;gap:3px;align-content:start}
  .side button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--muted)}
  .side button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .side .sep{height:1px;background:var(--line);margin:10px 4px}
  .h{font-size:30px;margin-bottom:6px}
  .lead{margin:0 0 16px;color:var(--muted)}
  .et{display:grid;grid-template-columns:6px 1fr auto;overflow:hidden;margin-bottom:12px}
  .et .body{padding:16px 18px}
  .et .act{padding:14px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:stretch}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--rose);margin:2px 4px 2px 0}
  .pill.grey{background:#EFEBE8;color:var(--muted)}
  .edit{padding:22px;display:grid;gap:16px}
  .sec{font-weight:600;margin-top:4px}
  .row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center}
  .row input[type=number]{width:84px}
  .member{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
  .member.off{background:#fcfbfa}
  .member.off .name{color:var(--muted)}
  .sw{width:38px;height:22px;border-radius:99px;background:#ddd;position:relative;border:0;padding:0;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:var(--rose)}.sw.on::after{left:19px}
  .sw:disabled{opacity:.35;cursor:not-allowed}
  .ok{color:var(--ok)} .warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse}
  td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
  th{color:var(--muted);font-weight:500}
  .tl{position:relative;height:30px;background:repeating-linear-gradient(45deg,#efeae6,#efeae6 6px,#f6f2ef 6px,#f6f2ef 12px);border-radius:6px;margin:4px 0}
  .tl span{position:absolute;top:3px;bottom:3px;border-radius:4px;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .tl .win{background:#F3E6EB;top:0;bottom:0;border-radius:6px;color:var(--rose)}
  .tl .bk{background:var(--rose)}
  .tl .buf{background:var(--rose2);opacity:.5}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:6px 0 0;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
  .box{padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .info{padding:12px 14px;border-radius:12px;background:var(--soft);color:#7a3f55;font-size:13px}
  .mail{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .mail .mh{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;background:#fcfbfa}
  .mail .mb{padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.55}
  .ntf{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
  .login{max-width:420px;margin:12vh auto;padding:34px;text-align:center;display:grid;gap:14px}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font-weight:600}
  .pub{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px;background:linear-gradient(180deg,#FBF8F6 0%,var(--bg) 45%,#F6E9EE 100%)}
  .pub>.logo{margin-bottom:18px}
  .funnel{width:100%;max-width:560px;padding:30px}
  .bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 22px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose2));transition:width .3s}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border:1px solid var(--line);background:#fff;border-radius:12px}
  .opt:hover{border-color:var(--rose2);background:#fffafb}
  .book{width:100%;max-width:1020px;display:grid;grid-template-columns:250px 1fr 220px;min-height:480px}
  .book>div{padding:24px}
  .book .infoc{border-right:1px solid var(--line)}
  .infoc .meta{margin-top:14px;display:grid;gap:8px;color:var(--muted)}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .mnav{display:flex;gap:6px;align-items:center}
  .mnav button{width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);color:var(--rose);font-weight:700}
  .mnav button:disabled{opacity:.3;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .grid .wd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .day{aspect-ratio:1;border-radius:50%;border:0;background:transparent;color:#c5bcb6;cursor:default}
  .day.av{background:var(--soft);color:var(--rose);font-weight:600;cursor:pointer}
  .day.sel{background:var(--rose);color:#fff}
  .slots{border-left:1px solid var(--line);overflow:auto;max-height:540px}
  .slot{display:flex;gap:6px;margin:0 0 8px}
  .slot button{flex:1;padding:11px 0;border:1px solid var(--rose2);color:var(--rose);background:#fff;border-radius:8px;font-weight:600}
  .slot button.pick{background:var(--ink);border-color:var(--ink);color:#fff}
  .slot .go{background:var(--rose);border-color:var(--rose);color:#fff}
  .form{display:grid;gap:10px}
  .done{width:100%;max-width:640px;padding:30px;display:grid;gap:12px;text-align:center}
  .behind{width:100%;max-width:640px;margin-top:14px;padding:16px 18px;border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.6);font-size:13px}
  .behind .t{font-weight:600;margin-bottom:6px;color:var(--muted)}
  .chk{display:flex;gap:8px;margin:5px 0}.chk b{color:var(--rose)}
  .setter{width:100%;max-width:1020px;margin-bottom:12px;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px}
  .foot{margin-top:auto;padding-top:24px;font-size:11px;color:#b5aaa3}
  @media (max-width:860px){.book{grid-template-columns:1fr}.book .infoc,.slots{border:0}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= Grunddaten (Beispiel) ================= */
const KEY = 'sq_buchungstool_proto_v2';
const STEP = 30;
const NOW = new Date(2026, 9, 4, 18, 0);           // Demo-"jetzt": So 04.10.2026, 18:00
const WT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const pad = n => String(n).padStart(2, '0');
const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fm = x => pad(Math.floor(x / 60)) + ':' + pad(x % 60);
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const wd = d => (d.getDay() + 6) % 7 + 1;
const dlong = d => `${WT[wd(d) - 1]}, ${d.toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'})}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const DEFAULTS = () => ({
  reps: {
    regina:   {name: 'Regina',   mail: 'regina@salesqueens.de',   rolle: 'Closerin', zoom: true, close: true,
               wins: {1: [['09:00','12:00']], 2: [['09:00','12:00'], ['14:00','17:00']], 3: [['09:00','12:00']], 4: [['09:00','12:00']], 5: [['09:00','12:00']]}},
    anthonia: {name: 'Anthonia', mail: 'anthonia@salesqueens.de', rolle: 'Closerin', zoom: true, close: true,
               wins: {1: [['11:00','16:00']], 2: [['11:00','16:00']], 3: [['10:00','13:00']], 4: [['11:00','16:00']], 5: [['11:00','14:00']]}},
    sophie:   {name: 'Sophie',   mail: 'sophie@salesqueens.de',   rolle: 'Closerin', zoom: true, close: true,
               wins: {1: [['14:00','20:00']], 2: [['14:00','20:00']], 3: [['14:00','20:00']], 4: [['15:00','18:00']]}},
    fabienne: {name: 'Fabienne', mail: 'fabienne@salesqueens.de', rolle: 'Closerin', zoom: true, close: true,
               wins: {1: [['10:00','13:00']], 3: [['16:00','19:00']], 4: [['10:00','13:00']], 5: [['09:00','12:00']]}},
    justine:  {name: 'Justine',  mail: 'justine@salesqueens.de',  rolle: 'Closerin', zoom: false, close: true,
               wins: {1: [['17:00','20:00']], 2: [['17:00','20:00']], 4: [['17:00','20:00']]}},
    swantje:  {name: 'Swantje',  mail: 'swantje@salesqueens.de',  rolle: 'Setterin + Closerin', zoom: true, close: true,
               wins: {1: [['16:00','19:00']], 2: [['09:00','12:00']], 3: [['09:00','15:00']], 4: [['13:00','16:00']]}},
    juliane:  {name: 'Juliane',  mail: 'juliane@salesqueens.de',  rolle: 'Setterin', zoom: true, close: true,
               wins: {1: [['09:00','13:00'], ['14:00','17:00']], 2: [['09:00','13:00']], 3: [['09:00','13:00'], ['14:00','17:00']], 4: [['09:00','13:00']], 5: [['09:00','12:00']]}},
  },
  events: [
    {id: 'strategy-call', name: 'Strategy Call', sub: 'Closing nach dem Webinar', titel: 'Dein Strategie-Gespräch', slug: 'webinar',
     einstieg: 'Webinar-Seite: erst die Fragen, dann der Kalender', dur: 60, buf: 30, chain: true, days: 14, notice: 4, ort: 'zoom', color: '#C0597B',
     notif: {r24: true, r1: true, sms: false},
     pool: {regina: {on: true, prio: 1}, anthonia: {on: true, prio: 1}, sophie: {on: true, prio: 1}}},
    {id: 'strategy-session', name: 'Strategy Session', sub: 'Closing nach dem Setting', titel: 'Dein Strategie-Gespräch', slug: 'strategy-session',
     einstieg: 'Aus Close: die Setterin bucht direkt, ohne Fragen', dur: 60, buf: 30, chain: true, days: 14, notice: 2, ort: 'zoom', color: '#8E3B5A',
     notif: {r24: true, r1: true, sms: false},
     pool: {regina: {on: true, prio: 1}, anthonia: {on: true, prio: 1}, sophie: {on: true, prio: 1}, fabienne: {on: true, prio: 2}}},
    {id: 'discovery-call', name: 'Discovery Call', sub: 'Setting', titel: 'Dein Onboarding-Call', slug: 'discovery-call',
     einstieg: 'Direkt-Link und Setting-Route aus dem Webinar-Funnel', dur: 30, buf: 0, chain: true, days: 7, notice: 2, ort: 'telefon', color: '#7C706A',
     notif: {r24: true, r1: true, sms: false},
     pool: {juliane: {on: true, prio: 1}}},
  ],
  funnel: {
    closerMin: 6, closer: 'strategy-call', setter: 'discovery-call',
    fragen: [
      {key: 'age', q: 'Wie alt bist du?', o: [['18 – 24', 0], ['25 – 34', 0], ['35 – 44', 0], ['45+', 0]]},
      {key: 'wohnort', q: 'Wo lebst du gerade?', o: [['Deutschland', 3], ['Österreich', 3], ['Schweiz', 3, 'setter'], ['Sonstiges', 1]]},
      {key: 'situation', q: 'Was beschreibt deine aktuelle Situation am besten?', o: [['Angestellt in Vollzeit', 3], ['Angestellt in Teilzeit', 2], ['Selbstständig', 3], ['Studentin / Schülerin', 1, 'setter'], ['In Elternzeit', 2], ['Aktuell ohne Job', 0, 'setter']]},
      {key: 'invest', q: 'Bist du bereit, in dich und deine Zukunft zu investieren?', o: [['Ja', 2], ['Weiß ich noch nicht', 1, 'setter'], ['Nein', 0, 'dq']]},
    ]},
  bookings: [],
});
let ST;
try { ST = JSON.parse(localStorage.getItem(KEY)) || DEFAULTS(); } catch { ST = DEFAULTS(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(ST));
const EV = id => ST.events.find(e => e.id === id);

/* ================= Kettenregel und Maske ================= */
function starts(g, block, chain) {
  const k = Math.floor((g.b - g.a) / block), lossless = [], kette = [];
  for (let s = Math.ceil(g.a / STEP) * STEP; s + block <= g.b; s += STEP) {
    const left = s - g.a, right = g.b - s - block;
    if (Math.floor(left / block) + 1 + Math.floor(right / block) !== k) continue;
    lossless.push(s);
    const rest = [[left, g.L], [right, g.R]].filter(p => p[0] % block);
    if (rest.length <= 1 && rest.every(p => p[1] === 'F')) kette.push(s);
  }
  if (!chain) return lossless;
  if (kette.length) return kette;
  return lossless.filter(s => s === g.a || s + block === g.b);   // Lücke zwischen zwei Terminen: direkt anschließen
}
function freiFenster(rep, day) {                                     // = Google frei/belegt minus gebuchte Termine + Puffer
  let gs = ((ST.reps[rep].wins || {})[wd(day)] || []).map(([a, b]) => ({a: hm(a), b: hm(b), L: 'F', R: 'F'}));
  for (const bk of ST.bookings.filter(x => !x.abgesagt && x.rep === rep && x.day === dkey(day)).sort((x, y) => x.s - y.s)) {
    const n = [];
    for (const g of gs) {
      if (bk.s < g.b && bk.s + bk.block > g.a) {
        if (bk.s > g.a) n.push({a: g.a, b: bk.s, L: g.L, R: 'T'});
        if (bk.s + bk.block < g.b) n.push({a: bk.s + bk.block, b: g.b, L: 'T', R: g.R});
      } else n.push(g);
    }
    gs = n;
  }
  return gs;
}
const startklar = (rep, ev) => !!ST.reps[rep] && ST.reps[rep].close && (ev.ort !== 'zoom' || ST.reps[rep].zoom);
const poolAktiv = ev => Object.entries(ev.pool).filter(([r, p]) => p.on && startklar(r, ev)).map(([r, p]) => ({rep: r, prio: p.prio}));
function maske(ev, day, nurRep) {
  const block = ev.dur + ev.buf, m = new Map();
  const frueh = new Date(NOW.getTime() + ev.notice * 3600e3);
  const spaet = new Date(NOW.getTime() + ev.days * 864e5);
  for (const p of poolAktiv(ev)) {
    if (nurRep && p.rep !== nurRep) continue;
    for (const g of freiFenster(p.rep, day)) for (const s of starts(g, block, ev.chain)) {
      const t = new Date(day); t.setHours(0, s, 0, 0);
      if (t < frueh || t > spaet) continue;
      if (!m.has(s)) m.set(s, []);
      m.get(s).push(p);
    }
  }
  return new Map([...m.entries()].sort((a, b) => a[0] - b[0]));
}
function zuteilen(ev, day, s) {
  const c = maske(ev, day).get(s) || [];
  const anzahl = r => ST.bookings.filter(b => !b.abgesagt && b.rep === r && b.ev === ev.id).length;
  return c.slice().sort((x, y) => x.prio - y.prio || anzahl(x.rep) - anzahl(y.rep))[0];
}
function buchbareTage(ev, nurRep) {
  const out = [];
  for (let i = 0; i <= ev.days; i++) { const d = new Date(NOW); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0); if (maske(ev, d, nurRep).size) out.push(d); }
  return out;
}

/* ================= Routing ================= */
const root = document.getElementById('root');
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1700); }
const pubLink = slug => location.origin + location.pathname + '#/buchen/' + slug;
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === KEY) { try { ST = JSON.parse(e.newValue) || DEFAULTS(); } catch { ST = DEFAULTS(); } route(); } });
function route() {
  const h = location.hash || '#/team';
  if (h.startsWith('#/buchen/')) { const slug = h.split('/')[2]; if (!P || P.slug !== slug) P = neuP(slug); renderPublic(); }
  else renderAdmin();
}

/* ================= Buchungsseite (öffentlich, ohne Verwaltung) ================= */
let P = null;
const neuP = slug => ({slug, step: 0, ans: {}, route: null, day: null, pick: null, form: false, booked: null, month: 0});
function routeAus(ans) {
  let score = 0, setter = false;
  for (const q of ST.funnel.fragen) { const o = q.o[ans[q.key]]; if (!o) continue; score += o[1]; if (o[2] === 'dq') return {r: 'dq', score}; if (o[2] === 'setter') setter = true; }
  return {r: setter ? ST.funnel.setter : score >= ST.funnel.closerMin ? ST.funnel.closer : ST.funnel.setter, score};
}
function shell(inner) { root.innerHTML = `<div class="pub"><div class="logo">salesqueens</div>${inner}<div class="foot">Prototyp · Beispielzeiten · es wird nichts gebucht</div></div>`; }
function renderPublic() {
  const evSlug = ST.events.find(e => e.slug === P.slug);
  if (!evSlug) { shell(`<div class="card funnel">Diese Seite gibt es nicht.</div>`); return; }
  const funnel = evSlug.id === ST.funnel.closer;             // nur die Webinar-Seite hat Fragen
  if (funnel && P.step < ST.funnel.fragen.length) {
    const q = ST.funnel.fragen[P.step], n = ST.funnel.fragen.length;
    shell(`<div class="card funnel">
      <div class="muted">Frage ${P.step + 1} von ${n}</div><div class="bar"><i style="width:${P.step / n * 100}%"></i></div>
      <h2 class="serif" style="font-size:28px;margin-bottom:14px">${esc(q.q)}</h2>
      ${q.o.map((o, i) => `<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join('')}
      ${P.step ? '<button class="ghost" id="zurueck" style="margin-top:10px">Zurück</button>' : ''}</div>`);
    root.querySelectorAll('.opt').forEach(b => b.onclick = () => { P.ans[q.key] = +b.dataset.i; P.step++; if (P.step === n) P.route = routeAus(P.ans); renderPublic(); });
    const z = document.getElementById('zurueck'); if (z) z.onclick = () => { P.step--; renderPublic(); };
    return;
  }
  if (funnel && P.route && P.route.r === 'dq') {
    shell(`<div class="card funnel" style="text-align:center"><h2 class="serif" style="font-size:28px">Aktuell können wir dich leider <i style="color:var(--rose)">nicht begleiten</i></h2>
      <p class="muted">Unsere Ausbildung ist eine bezahlte Weiterbildung. Sobald sich das ändert, komm gerne wieder.</p><button class="link" id="neu">Antworten ändern</button></div>`);
    document.getElementById('neu').onclick = () => { P = neuP(P.slug); renderPublic(); };
    return;
  }
  const ev = funnel ? EV(P.route.r) : evSlug;
  if (P.booked) return renderBestaetigung(ev);
  const tage = buchbareTage(ev), verf = new Set(tage.map(dkey));

  const letzter = tage.length ? tage[tage.length - 1] : NOW;
  const maxMonth = (letzter.getFullYear() - NOW.getFullYear()) * 12 + letzter.getMonth() - NOW.getMonth();
  const setterLeiste = ev.id === 'strategy-session' ? `<div class="setter"><span class="pill">Setterin</span> Aus Close geöffnet für <b>Lea Beispiel</b>. Name, Mail und Telefon sind übernommen, die Bestätigung geht an die Kundin.</div>` : '';

        <div class="mnav"><button id="mv" ${P.month <= 0 ? 'disabled' : ''}>‹</button><span class="muted" style="min-width:110px;text-align:center">${first.toLocaleDateString('de-DE', {month: 'long', year: 'numeric'})}</span><button id="mn" ${P.month >= maxMonth ? 'disabled' : ''}>›</button></div></div>
      <div class="grid">${WT.map(w => `<div class="wd">${w}</div>`).join('')}
      ${zellen.map(d => d ? `<button class="day ${verf.has(dkey(d)) ? 'av' : ''} ${dkey(d) === P.day ? 'sel' : ''}" data-d="${dkey(d)}">${d.getDate()}</button>` : '<div></div>').join('')}</div>
      <div class="hint" style="margin-top:14px">Zeitzone: Europa/Berlin</div></div>
    <div class="slots">${P.form && sel ? formHtml(ev) : `<div class="muted" style="margin-bottom:10px">${sel ? dlong(sel) : 'Gerade sind keine Termine frei'}</div>
      ${[...m.keys()].map(s => `<div class="slot">${P.pick === s ? `<button class="pick">${fm(s)}</button><button class="go" data-go="${s}">Weiter</button>` : `<button data-s="${s}">${fm(s)}</button>`}</div>`).join('')}`}
    </div></div>`);
  const neu = document.getElementById('neu'); if (neu) neu.onclick = () => { P = neuP(P.slug); renderPublic(); };
  document.getElementById('mv').onclick = () => { P.month--; renderPublic(); };
  document.getElementById('mn').onclick = () => { P.month++; renderPublic(); };
  root.querySelectorAll('.day.av').forEach(b => b.onclick = () => { P.day = b.dataset.d; P.pick = null; P.form = false; renderPublic(); });
  root.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { P.pick = +b.dataset.s; renderPublic(); });
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { P.form = true; renderPublic(); });
  if (P.form && sel) {
    document.getElementById('fz').onclick = () => { P.form = false; renderPublic(); };
    document.getElementById('fok').onclick = () => {
      const p = zuteilen(ev, sel, P.pick);
      if (!p) { toast('Gerade vergeben, bitte eine andere Zeit wählen'); P.pick = null; P.form = false; return renderPublic(); }
      const b = {id: Date.now(), ev: ev.id, rep: p.rep, day: dkey(sel), s: P.pick, block: ev.dur + ev.buf, dur: ev.dur,
                 lead: {name: document.getElementById('fn').value, mail: document.getElementById('fmail').value, tel: document.getElementById('ftel').value},
                 antworten: funnel ? P.ans : null, route: funnel ? P.route : null,
                 quelle: funnel ? 'Webinar-Funnel' : ev.id === 'strategy-session' ? 'Setterin aus Close' : 'Direkt-Link'};
      ST.bookings.push(b); save(); P.booked = b; P.form = false; P.pick = null; renderPublic();
    };
  }
}

      const bks = ST.bookings.filter(b => !b.abgesagt && b.rep === r && b.day === dkey(d)).map(b => `<span class="bk" style="left:${sc(b.s)}%;width:${sc(b.s + b.dur) - sc(b.s)}%">${fm(b.s)}</span>${b.block > b.dur ? `<span class="buf" style="left:${sc(b.s + b.dur)}%;width:${sc(b.s + b.block) - sc(b.s + b.dur)}%"></span>` : ''}`).join('');
      return `<div style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px"><div>${esc(x.name)}</div><div class="tl">${wins}${bks}</div></div>`; }).join('')}
      <div style="display:grid;grid-template-columns:90px 1fr;gap:8px"><div></div><div class="hint" style="position:relative;height:16px">${['08:00', '12:00', '16:00', '20:00'].map(t => `<span style="position:absolute;left:${sc(hm(t))}%;transform:translateX(-50%)">${t}</span>`).join('')}</div></div>
      <div class="legend"><span><i style="background:repeating-linear-gradient(45deg,#efeae6,#efeae6 3px,#f6f2ef 3px,#f6f2ef 6px)"></i>in Google geblockt</span><span><i style="background:#F3E6EB"></i>frei</span><span><i style="background:var(--rose)"></i>gebucht</span><span><i style="background:var(--rose2);opacity:.5"></i>Puffer</span></div></div>`;
}
function mailTexte(e) {
  const zoom = e.ort === 'zoom', was = e.titel.replace(/^Dein /, 'dein '), Was = was[0].toUpperCase() + was.slice(1);
  return [
    {k: 'confirm', titel: 'Bestätigung', wann: 'sofort nach der Buchung', kanal: 'Mail', pflicht: true,
     betreff: `${e.titel} am {Datum} um {Uhrzeit} Uhr`,
     text: `Hallo {Vorname},\n\nschön, dass du dir die Zeit nimmst. ${Was} mit {Vertrieblerin} steht:\n\n{Wochentag}, {Datum}, {Uhrzeit} Uhr (${e.dur} Minuten)\n${zoom ? 'Zoom: {Zoom-Link}' : 'Ich rufe dich unter {Telefon} an.'}\n\nDie Einladung für deinen Kalender kommt in einer eigenen Mail.\nPasst es doch nicht? Verschieben: {Verschieben-Link}\nAbsagen: {Absagen-Link}\n\nBis bald\n{Vertrieblerin}`},
    {k: 'r24', titel: 'Erinnerung', wann: '24 Stunden vorher', kanal: 'Mail',
     betreff: 'Wir sehen uns morgen',
     text: `Hallo {Vorname},\n\nmorgen um {Uhrzeit} Uhr ist ${was} mit {Vertrieblerin}.\n${zoom ? 'Zoom: {Zoom-Link}' : 'Ich rufe dich unter {Telefon} an.'}\n\nFalls etwas dazwischenkommt: {Verschieben-Link}\n\nBis morgen\n{Vertrieblerin}`},
    {k: 'r1', titel: 'Erinnerung', wann: '1 Stunde vorher', kanal: 'Mail',
     betreff: `In einer Stunde geht's los`,
     text: `Hallo {Vorname},\n\num {Uhrzeit} Uhr geht's los.\n${zoom ? 'Hier ist dein Zoom-Link: {Zoom-Link}' : 'Halte dein Telefon bereit, ich rufe dich an.'}\n\nBis gleich\n{Vertrieblerin}`},
    {k: 'sms', titel: 'Erinnerung', wann: '3 Stunden vorher', kanal: 'SMS',
     text: `Hi {Vorname}, heute um {Uhrzeit} Uhr ist ${was} mit {Vertrieblerin}. ${zoom ? 'Den Zoom-Link hast du per Mail.' : 'Sie ruft dich an.'} Salesqueens`},
  ];
}
function adminNotif() {
  const e = EV(A.notifEv), T = mailTexte(e);
  return `<h2 class="serif h">Benachrichtigungen</h2><p class="lead">Pro Ereignistyp, wie bei Calendly. Mails gehen aus dem Postfach der Vertrieblerin über Close und liegen danach am Lead. Die Google-Kalendereinladung an die Kundin kommt immer dazu.</p>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">${ST.events.map(x => `<button class="ghost sm" data-nev="${x.id}" style="${x.id === A.notifEv ? 'background:var(--ink);color:#fff;border-color:var(--ink)' : ''}">${esc(x.name)}</button>`).join('')}</div>
    ${T.map(t => `<div class="ntf"><div><b>${t.titel}</b> <span class="hint">· ${t.wann} · ${t.kanal}</span></div>
      ${t.pflicht ? '<span class="hint">immer an</span>' : `<button class="sw ${e.notif[t.k] ? 'on' : ''}" data-n="${t.k}"></button>`}</div>`).join('')}
    <div class="info" style="margin:12px 0">SMS ist optional und kostet pro Nachricht. Für Calendly-Termine sind SMS-Erinnerungen heute aus (seit 03.08., Kostengründe). Vorschlag: erst beim Discovery Call testen, dort gibt es die meisten No-Shows.</div>
    <div class="sec" style="margin-bottom:8px">Vorschau der Texte (Entwurf, Platzhalter in geschweiften Klammern)</div>
    <div style="display:grid;gap:10px">${T.filter(t => t.pflicht || e.notif[t.k]).map(t => `<div class="mail"><div class="mh"><b>${t.kanal === 'SMS' ? 'SMS' : 'Betreff: ' + esc(t.betreff)}</b> <span class="hint">· ${t.wann}</span></div><div class="mb">${esc(t.text)}</div></div>`).join('')}</div>`;
}
function bindAdmin() {
  const q = id => document.getElementById(id);
  root.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { A.edit = b.dataset.e; renderAdmin(); });
  if (A.tab === 'events' && A.edit) {
    const e = EV(A.edit);
    q('back').onclick = () => { A.edit = null; renderAdmin(); };
    q('titel').onchange = ev => { e.titel = ev.target.value; save(); };
    ['dur', 'buf', 'days', 'notice'].forEach(k => q(k).onchange = ev => { e[k] = Math.max(k === 'dur' || k === 'days' ? 1 : 0, +ev.target.value || 0); save(); renderAdmin(); });
    q('ort').onchange = ev => { e.ort = ev.target.value; save(); renderAdmin(); };
    q('chain').onclick = () => { e.chain = !e.chain; save(); renderAdmin(); };
    q('toNotif').onclick = () => { A.tab = 'notif'; A.notifEv = e.id; A.edit = null; renderAdmin(); };
    root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const r = b.dataset.m; e.pool[r] = e.pool[r] || {on: false, prio: 2}; e.pool[r].on = !e.pool[r].on; save(); renderAdmin(); });
    root.querySelectorAll('[data-prio]').forEach(i => i.onchange = () => { const r = i.dataset.prio; e.pool[r] = e.pool[r] || {on: false, prio: 2}; e.pool[r].prio = +i.value; save(); });
  }
  if (A.tab === 'funnel') q('cmin').onchange = ev => { ST.funnel.closerMin = +ev.target.value; save(); };
  if (A.tab === 'team') {
    q('neuBtn').onclick = () => { A.neu = true; renderAdmin(); };
    root.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { const [r, k] = b.dataset.fix.split(':'); ST.reps[r][k] = true; save(); toast('Im Prototyp als verbunden markiert'); renderAdmin(); });
    if (A.neu) {
      q('nX').onclick = () => { A.neu = false; renderAdmin(); };
      q('nOk').onclick = () => {
        const name = q('nName').value.trim(), mail = q('nMail').value.trim().toLowerCase();
        if (!name || !/^[a-z0-9._-]+@salesqueens\.de$/.test(mail)) return toast('Nur @salesqueens.de-Konten');
        const id = mail.split('@')[0];
        if (ST.reps[id]) return toast('Gibt es schon');
        ST.reps[id] = {name, mail, rolle: q('nRolle').value, zoom: false, close: false,
                       wins: {1: [['09:00', '12:00'], ['14:00', '17:00']], 2: [['09:00', '12:00'], ['14:00', '17:00']], 3: [['09:00', '12:00']], 4: [['14:00', '17:00']], 5: [['09:00', '12:00']]}};
        save(); A.neu = false; toast(name + ' angelegt, Kalender aus Google gelesen'); renderAdmin();
      };
    }
  }
  if (A.tab === 'booked') root.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => { const x = ST.bookings.find(y => String(y.id) === b.dataset.cx); x.abgesagt = true; save(); toast('Abgesagt, Zeit ist wieder frei'); renderAdmin(); });
  if (A.tab === 'avail') root.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { A.availDay = b.dataset.day; renderAdmin(); });
  if (A.tab === 'notif') {
    root.querySelectorAll('[data-nev]').forEach(b => b.onclick = () => { A.notifEv = b.dataset.nev; renderAdmin(); });
    root.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const e = EV(A.notifEv); e.notif[b.dataset.n] = !e.notif[b.dataset.n]; save(); renderAdmin(); });
  }
}

window.__sq = {maske, starts, hm, fm, EV, ST: () => ST, buchbareTage, dkey, fromKey, reset: () => { ST = DEFAULTS(); save(); }};
route();
</script>
